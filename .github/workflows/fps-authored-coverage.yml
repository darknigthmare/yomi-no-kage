name: FPS authored atlas provenance

on:
  pull_request:
    paths:
      - '.github/workflows/fps-authored-coverage.yml'
      - 'assets/modular/fps/characters/**'
      - 'assets/modular/manifests/**'
      - 'tools/audit-fps-authored-coverage*.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fps-authored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit sources et vues FPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validation syntaxique
        run: node --check tools/audit-fps-authored-coverage.mjs
      - name: Test de cohérence et anti-fausse provenance
        run: node tools/audit-fps-authored-coverage-smoke-test.mjs
      - name: Vérification des atlas authored réellement publiés
        run: node tools/audit-fps-authored-coverage.mjs --check
